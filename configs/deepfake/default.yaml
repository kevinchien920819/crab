general:
  device: cuda
  device_id: '0'
  work_dir: default
  seed: 39
  deterministic: true
  freeze: []
  unfreeze: []
  ckpt:
    path: ''
    modules:
      from:
      - all
      to:
      - all
  testing_ckpt: default
  train: true
  eval: true
  produce_evaluation_file: true

model:
  name: DeepfakeAudioRhythmTransformerModel
  tag: v1
  description: ''
  ssl_model_str: WAV2VEC2_XLSR_300M
  text_model_str: ROBERTA_LARGE_ENCODER
  use_audio: true
  use_rhythm: false
  use_text: false
  rhythm_sources:
  - syllable
  - vowel
  - consonant
  num_classes: 2
  d_model: 256
  d_contrastive: 128
  n_heads: 4
  n_transformer_encoder_layers: 1
  n_rhythm_encoder_layers: 4
  dropout: 0.3

solver:
  optimizer: AdamW
  weight_decay: 0.01
  scheduler: div
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  min_lr:
  max_grad_norm: 1.0
  max_epochs: 20
  freeze_epochs: 0
  lr:
    default: 0.0001
  iters_to_accumulate: 8
  amp_dtype: fp16
  criterions:
    wce_loss:
      name: CrossEntropyLoss
      label_smoothing: 0.1
      weight: 0
      total_weight: 1.0

datasets:
  train_datasets:
  - name: ASVspoof5
    dir: /data/m314832018/Lab8/crab/dataset
    use_duration: true
  test_datasets:
  - name: ASVspoof5
    dir: /data/m314832018/Lab8/crab/dataset
    use_duration: true

dataloader:
  name: Dataset
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  non_blocking_transfer: true
  token_batch_size: 0
  text_max_len: 128
  smoothed_class_batch_size: 500
  class_smoothing_power: 0.5
  batch_size:
    train: 8
    dev: 4
    eval: 4

linebot:
  enable: false

wandb:
  enable: true
  entity: icebird50817
  project: crab
